name: Contribution Heartbeat (Random 15-25 Daily)

on:
  schedule:
    # Runs once daily at 12:00 UTC (07:00 AM EST)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Random 15-25 commits
        shell: bash
        env:
          GH_NAME: rohanmalhotra0
          GH_EMAIL: 104740676+rohanmalhotra0@users.noreply.github.com
        run: |
          mkdir -p .github/heartbeat
          if [ -n "${GH_NAME}" ] && [ -n "${GH_EMAIL}" ]; then
            git config user.name "${GH_NAME}"
            git config user.email "${GH_EMAIL}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          COMMITS=$((15 + RANDOM % 11))
          echo "Planning to create $COMMITS commits today"

          if [ "$COMMITS" -gt 0 ]; then
            for i in $(seq 1 $COMMITS); do
              printf "%sZ - heartbeat %d/%d rand=%04d\n" "$(date -u +'%Y-%m-%d %H:%M:%S')" "$i" "$COMMITS" "$RANDOM" >> .github/heartbeat/keepalive.md
              git add .github/heartbeat/keepalive.md
              git commit -m "chore(heartbeat): keepalive $i/$COMMITS [skip ci]" || true
            done
            # Rebase to reduce push races, then push
            git pull --rebase || true
            git push || true
          else
            echo "Unexpected: zero commits chosen though min is 15."
          fi


